<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CineReview</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <span class="logo-icon">🎬</span>
        <span>Cine<span class="logo-accent">Review</span></span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#movies-section">Browse Movies</a></li>
        <li><a href="add-review.html">Add Review</a></li>
      </ul>

      <div class="nav-auth" id="nav-auth-container">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </nav>

  <!-- Login Card -->
  <main class="container">
    <div class="form-card">
      <div class="form-header">
        <h2>👋 Welcome Back</h2>
        <p>Log in to your account to review movies and share ratings.</p>
      </div>

      <!-- Error Message Container -->
      <div id="login-error" class="alert alert-danger" style="display: none;"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email" class="form-label">Email Address *</label>
          <input type="email" id="login-email" class="form-input" placeholder="e.g. rahul@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="login-password" class="form-label">Password *</label>
          <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width: 100%; padding: 13px; font-size: 1rem;">
          Sign In
        </button>
      </form>

      <div class="form-footer">
        Don't have an account? <a href="register.html">Create one here</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>🎬 <strong>Movie Review System</strong> • Full-Stack Web Application</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/auth-pages.js"></script>
</body>
</html>
