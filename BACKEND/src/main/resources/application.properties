# ==========================================
# Movie Review System - Application Configuration
# ==========================================

# Server Port
server.port=8080

# Application Name
spring.application.name=movie-review-backend

# ------------------------------------------
# MySQL Database Configuration
# ------------------------------------------
# Automatically creates the database 'movie_review_db' if it does not exist
spring.datasource.url=jdbc:mysql://localhost:3306/movie_review_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------
# Hibernate & JPA Properties
# ------------------------------------------
# 'update' automatically updates database schema according to Entities without losing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Open In View
spring.jpa.open-in-view=true

# Logging
logging.level.com.moviereview=DEBUG
logging.level.org.hibernate.SQL=DEBUG
