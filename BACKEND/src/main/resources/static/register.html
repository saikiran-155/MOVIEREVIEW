<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - CineReview</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <span class="logo-icon">🎬</span>
        <span>Cine<span class="logo-accent">Review</span></span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#movies-section">Browse Movies</a></li>
        <li><a href="add-review.html">Add Review</a></li>
      </ul>

      <div class="nav-auth" id="nav-auth-container">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </nav>

  <!-- Register Card -->
  <main class="container">
    <div class="form-card">
      <div class="form-header">
        <h2>✨ Join CineReview</h2>
        <p>Create your free account to submit ratings and reviews.</p>
      </div>

      <!-- Error Message Container -->
      <div id="register-error" class="alert alert-danger" style="display: none;"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="register-name" class="form-label">Full Name *</label>
          <input type="text" id="register-name" class="form-input" placeholder="e.g. John Doe" required autocomplete="name">
        </div>

        <div class="form-group">
          <label for="register-email" class="form-label">Email Address *</label>
          <input type="email" id="register-email" class="form-input" placeholder="e.g. john@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="register-password" class="form-label">Password (Min. 6 characters) *</label>
          <input type="password" id="register-password" class="form-input" placeholder="Create a secure password" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="register-confirm-password" class="form-label">Confirm Password *</label>
          <input type="password" id="register-confirm-password" class="form-input" placeholder="Re-enter your password" required autocomplete="new-password">
        </div>

        <button type="submit" id="register-submit-btn" class="btn btn-primary" style="width: 100%; padding: 13px; font-size: 1rem;">
          Create Free Account
        </button>
      </form>

      <div class="form-footer">
        Already registered? <a href="login.html">Sign in here</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>🎬 <strong>Movie Review System</strong> • Full-Stack Web Application</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/auth-pages.js"></script>
</body>
</html>
